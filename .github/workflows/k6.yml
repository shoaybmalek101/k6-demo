name: k6 Load Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  k6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 bottleneck test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: ${{ github.workspace }}/bottleneck-demo.js
